map $http_upgrade $suichuan_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name xcopy.werfamily.fun;
    return 301 https://xcopy.werfamily.fun$request_uri;
}

server {
    listen 443 ssl;
    server_name xcopy.werfamily.fun;
    ssl_certificate /home/wenming/ssl/cert.crt;
    ssl_certificate_key /home/wenming/ssl/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $suichuan_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        # Only this trusted proxy supplies the address used for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
