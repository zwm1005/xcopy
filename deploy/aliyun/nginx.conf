map $http_upgrade $suichuan_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name send.example.com;
    return 301 https://send.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name send.example.com;
    ssl_certificate /etc/ssl/suichuan/fullchain.pem;
    ssl_certificate_key /etc/ssl/suichuan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    # Discovery routes are generated by Node from PUBLIC_ORIGIN and INDEXNOW_KEY.
    # The normal proxy below handles /robots.txt, /sitemap.xml and /indexnow.txt.

    location = /index.html {
        return 301 https://send.example.com/$is_args$args;
    }

    location ^~ /downloads/xcopy/ {
        alias /opt/suichuan/downloads/xcopy/;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $suichuan_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        # Only this trusted proxy supplies the address used for rate limiting.
        # With a CDN, configure realip using only its exact CIDRs and recursive
        # parsing before this override; never pass arbitrary incoming XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
