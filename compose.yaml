services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请在 .env 中设置 HTTPS 域名}
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/suichuan.sqlite
      TRUST_PROXY: "1"
      MAX_FILE_MB: ${MAX_FILE_MB:-50}
      PAIR_GLOBAL_LIMIT: ${PAIR_GLOBAL_LIMIT:-100}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-1000}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-64}
      WS_MAX_CONNECTIONS_PER_DEVICE: ${WS_MAX_CONNECTIONS_PER_DEVICE:-8}
      WS_MAX_PENDING_CONNECTIONS: ${WS_MAX_PENDING_CONNECTIONS:-128}
      WS_MAX_PENDING_PER_IP: ${WS_MAX_PENDING_PER_IP:-8}
      WS_MAX_GUEST_CONNECTIONS: ${WS_MAX_GUEST_CONNECTIONS:-256}
      WS_GUEST_IDLE_SECONDS: ${WS_GUEST_IDLE_SECONDS:-60}
      WS_PUBLISH_INTERVAL_MS: ${WS_PUBLISH_INTERVAL_MS:-50}
      WS_MAX_BUFFERED_KB: ${WS_MAX_BUFFERED_KB:-1024}
      WS_MESSAGE_RATE_PER_MINUTE: ${WS_MESSAGE_RATE_PER_MINUTE:-3000}
      WS_MESSAGE_BURST: ${WS_MESSAGE_BURST:-256}
      WS_RENAME_RATE_PER_MINUTE: ${WS_RENAME_RATE_PER_MINUTE:-10}
      WS_RENAME_BURST: ${WS_RENAME_BURST:-3}
      WS_RENAME_IP_RATE_PER_MINUTE: ${WS_RENAME_IP_RATE_PER_MINUTE:-60}
      WS_RENAME_IP_BURST: ${WS_RENAME_IP_BURST:-12}
      WS_TRANSFER_RATE_PER_MINUTE: ${WS_TRANSFER_RATE_PER_MINUTE:-600}
      WS_TRANSFER_BURST: ${WS_TRANSFER_BURST:-16}
      WS_TRANSFER_IP_RATE_PER_MINUTE: ${WS_TRANSFER_IP_RATE_PER_MINUTE:-1800}
      WS_TRANSFER_IP_BURST: ${WS_TRANSFER_IP_BURST:-48}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      STUN_URLS: ${STUN_URLS:-}
      TURN_AUTH_MODE: ${TURN_AUTH_MODE:-shared-secret}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      CLI_DOWNLOAD_URL: ${CLI_DOWNLOAD_URL:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-0}
      ANALYTICS_PATH: ${ANALYTICS_PATH:-/api/analytics}
      SHARE_CONCURRENCY: ${SHARE_CONCURRENCY:-3}
      SHARE_QUEUE_LIMIT: ${SHARE_QUEUE_LIMIT:-20}
      FORCE_RELAY: ${FORCE_RELAY:-0}
    volumes:
      - app-data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请设置 HTTPS 域名}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app-data:
  caddy-data:
  caddy-config:
