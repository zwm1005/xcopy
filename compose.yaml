services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请在 .env 中设置 HTTPS 域名}
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/suichuan.sqlite
      TRUST_PROXY: "1"
      MAX_FILE_MB: ${MAX_FILE_MB:-50}
      PAIR_GLOBAL_LIMIT: ${PAIR_GLOBAL_LIMIT:-100}
      TURN_URLS: ${TURN_URLS:?请设置 TURN 地址}
      TURN_SECRET: ${TURN_SECRET:?请生成 TURN 共享密钥}
      STUN_URLS: ${STUN_URLS:-}
      FORCE_RELAY: ${FORCE_RELAY:-0}
    volumes:
      - app-data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请设置 HTTPS 域名}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
  turn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # 公网 Linux 主机使用 host 网络，避免媒体端口的大量 Docker NAT 映射。
    network_mode: host
    entrypoint: ["/bin/sh", "/opt/suichuan/turn-entrypoint.sh"]
    environment:
      TURN_SECRET: ${TURN_SECRET:?请生成 TURN 共享密钥}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?请设置中继服务器公网 IPv4}
      TURN_REALM: ${TURN_REALM:?请设置 TURN realm}
    volumes:
      - ./deploy/turn-entrypoint.sh:/opt/suichuan/turn-entrypoint.sh:ro
      - ./deploy/turn-limits.conf:/opt/suichuan/turn-limits.conf:ro
    security_opt:
      - no-new-privileges:true
volumes:
  app-data:
  caddy-data:
  caddy-config:
